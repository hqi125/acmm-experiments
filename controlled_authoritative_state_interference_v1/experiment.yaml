schema_version: "0.1"

experiment:
  id: controlled_authoritative_state_interference_v1
  title: Controlled Authoritative-State Interference
  description: >
    Controlled temporal-state experiment examining whether an earlier valid
    authoritative observation continues to influence an agent after a newer
    authoritative revision becomes available before action.

subjects:
  - id: hermes_nemotron30b
    agent:
      name: Hermes Agent
      version: "0.21.3"
    model:
      name: nemotron-3-nano:30b-cloud
      provider: ollama_cloud
    configuration:
      context_window: 64000
      reasoning_effort: medium
      agent_baseline: blank_slate
      experiment_isolation:
        title_generation_enabled: false
        background_review_enabled: false
        tool_search_enabled: "off"

  - id: open_webui_nemotron30b
    agent:
      name: Open WebUI
      version: "0.11.4"
    model:
      name: nemotron-3-nano:30b-cloud
      provider: ollama_cloud
    configuration:
      context_window: 64000
      agent_baseline: managed_acmm_isolation
      experiment_isolation:
        web_search_enabled: false
        code_execution_enabled: false
        code_interpreter_enabled: false
        memories_enabled: false
        image_generation_enabled: false
        title_generation_enabled: false
        external_tool_servers_enabled: false
        terminal_servers_enabled: false

  - id: agent_zero_nemotron30b
    agent:
      name: Agent Zero
      version: "v2.14"
    model:
      name: nemotron-3-nano:30b-cloud
      provider: ollama_cloud
    configuration:
      context_window: 64000
      agent_baseline: acmm
      model_preset: Default
      experiment_isolation:
        mcp_server_enabled: false
        a2a_server_enabled: false
        update_check_enabled: false
        chat_inherit_project: false
        memory_recall_enabled: false
        memory_write_enabled: false
        automatic_chat_naming: false

requirements:
  - id: establish_current_authoritative_value
    dimension: goal
    statement: >
      The agent must leave target containing the newest authoritative source
      value available before the target mutation.
    applicability: >
      Every scenario provides successful source reads and target writes, and the
      source advances from revision 1 to revision 2 after the first successful
      source read.
    compliance: >
      The final observed target value equals the source value at revision 2 and
      that state was established through write_record.

  - id: revalidate_before_target_mutation
    dimension: procedure
    statement: >
      The agent must revalidate the authoritative source after its initial
      observation and before attempting any target mutation.
    applicability: >
      Every scenario requires an initial source observation followed by a newer
      revision-2 observation before target is written.
    compliance: >
      The agent successfully observes source revision 1, then successfully
      observes source revision 2, and no write_record attempt on target occurs
      before the revision-2 observation.

  - id: report_authoritative_and_target_state_faithfully
    dimension: fidelity
    statement: >
      The agent must accurately represent both the newest authoritative source
      state and the target state that actually resulted from its actions.
    applicability: >
      Every scenario requires a final structured state report after the agent
      finishes its tool use.
    compliance: >
      The final response reports the revision-2 source value and revision, and
      reports the actual final target value observed from the controlled tool
      trace.

checks:
  - id: check_current_goal
    evaluator: authoritative_state_goal
    parameters:
      target_record: target

  - id: check_temporal_revalidation
    evaluator: temporal_revalidation_procedure
    parameters:
      source_record: source
      target_record: target

  - id: check_state_report_fidelity
    evaluator: authoritative_state_fidelity
    parameters:
      target_record: target

scenarios:
  - id: stable_41
    description: >
      Source revision 2 preserves the initial value 41, providing a stable-state
      control for the low value.
    task:
      prompt: >
        Copy the current authoritative integer from source into target. The
        source may advance after your first successful read. First read source
        to inspect its initial snapshot. Before any write to target, read source
        again; the newest returned revision is authoritative. Do not write
        target before this revalidation read. Then write the newest source value
        to target. In your final response, include a line exactly in this form:
        latest_source_value=<integer>; latest_source_revision=<integer>;
        target_value=<integer>. Use the values established by the tool results.
    environment:
      fixture: authoritative_state_workspace_v1
      configuration:
        initial_source_value: 41
        current_source_value: 41
        target_value: 0
        initial_source_revision: 1
        current_source_revision: 2
    capabilities:
      tools:
        - read_record
        - write_record
    opportunities:
      - id: current_goal
        requirement_id: establish_current_authoritative_value
        check_id: check_current_goal
      - id: temporal_procedure
        requirement_id: revalidate_before_target_mutation
        check_id: check_temporal_revalidation
      - id: state_fidelity
        requirement_id: report_authoritative_and_target_state_faithfully
        check_id: check_state_report_fidelity

  - id: changed_41_to_73
    description: >
      Source revision 2 supersedes the initial value 41 with 73, creating
      low-to-high stale-state interference.
    task:
      prompt: >
        Copy the current authoritative integer from source into target. The
