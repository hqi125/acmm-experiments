        check_id: check_temporal_revalidation
      - id: state_fidelity
        requirement_id: report_authoritative_and_target_state_faithfully
        check_id: check_state_report_fidelity

evidence_policy:
  capture:
    - conversation
    - tool_calls
    - tool_results
    - final_response

run_protocol:
  repetitions: 4
  ordering: subject_repetition_scenario
  scenario_ordering: cyclic_rotation
  pacing:
    inter_run_delay_seconds: 0.5
  reset:
    conversation: fresh
    memory: baseline
    workspace: baseline
    environment: baseline
  termination:
    timeout_seconds: 120
