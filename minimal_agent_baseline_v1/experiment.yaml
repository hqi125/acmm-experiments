- id: g1_b_conditional_release
  description: Build a six-stage common release prefix and mutually exclusive PASS/FAIL tails with asymmetric
    completion semantics.
  task:
    prompt: >-
      Build a conditional release plan. Common tasks A-H must be assigned to exactly six ordered nonempty
      stages, with at most three tasks per common stage.


      Common task labels: A Build Candidate; B Prepare Rollback Bundle; C Prepare Release Record; D Validate
      Candidate; E Verify Rollback Bundle; F Authorize Pilot; G Deploy Pilot; H Assess Pilot.

      Common prerequisites: A before D; B before E; C before F; D before F; E before F; F before G; G
      before H.


      After H:

      - PASS branch: I Deploy Full Release, then J Verify Full Release, then terminal state COMPLETE.
      K and L must not execute.

      - FAIL branch: K Roll Back Pilot, then L Verify Rollback, then terminal state ROLLED_BACK. I and
      J must not execute.

      - Only COMPLETE is successful release completion; ROLLED_BACK is not successful release completion.


      Return one JSON object with this shape:

      {"result":{"common_stages":[["A","B","C"],["D"],["E"],["F"],["G"],["H"]],"pass_branch":["I","J"],"pass_terminal":"COMPLETE","fail_branch":["K","L"],"fail_terminal":"ROLLED_BACK","successful_branch":"PASS"}}

      Any valid six-stage common plan is accepted.
  capabilities:
    tools: []
  opportunities:
  - id: valid_conditional_plan
