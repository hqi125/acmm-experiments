- id: g1_a_project_execution
  description: Build a five-stage project plan under foundation/acceptance gates, dependencies, and completion
    semantics.
  task:
    prompt: >-
      Assign project tasks A-J to exactly five ordered nonempty stages. Every task appears exactly once
      and each stage may contain at most three tasks.


      Task labels: A Requirements Baseline; B Environment Inventory; C Acceptance Criteria; D Interface
      Plan; E Data Mapping; F Test Harness; G Integrated Prototype; H Validation Report; I Quality Review;
      J Operations Review.


      Rules:

      - Foundation gate: A, B, and C must all be complete before any of D, E, or F begins.

      - D before G.

      - E before G.

      - E before H.

      - F before H.

      - Acceptance gate: G and H must both be complete before either I or J begins.

      - Project completion may be declared only after both I and J are complete.


      Return one JSON object with this shape:

      {"result":{"stages":[["A","B","C"],["D"],["E","F"],["G","H"],["I","J"]],"completion_stage":5}}

      Any valid five-stage plan is accepted.
  capabilities:
    tools: []
  opportunities:
  - id: valid_project_plan
    requirement_id: achieve_scenario_goal
    check_id: check_minimal_baseline
  - id: task_preservation
    requirement_id: preserve_task_fidelity
