schema_version: "0.2"
experiment_id: github_mcp_integration_qualification_v1
contract: experiment.yaml

runtime:
  api_version: "0.1"
  root: runtime
  entrypoint: build_runtime

integrations:
  - id: github_mcp
    api_version: "0.2"
    root: integration/github_mcp
    entrypoint: build_integration
    preset: local_pinned
    secrets:
      - id: access_token
        required: true
    configuration:
      endpoint: http://host.docker.internal:8082
      server_id: github
      tools:
        - actions_get
        - actions_list
        - add_comment_to_pending_review
        - add_issue_comment
        - add_reply_to_pull_request_comment
        - create_branch
        - create_or_update_file
        - create_pull_request
        - delete_file
        - get_commit
        - get_file_contents
        - get_job_logs
        - get_label
        - get_latest_release
        - get_release_by_tag
        - get_repository_tree
        - get_tag
        - issue_read
        - issue_write
        - label_write
        - list_branches
        - list_commits
        - list_issues
        - list_label
        - list_pull_requests
        - list_releases
        - list_repository_collaborators
        - list_tags
        - merge_pull_request
        - pull_request_read
        - pull_request_review_write
        - push_files
        - search_code
        - search_commits
        - search_issues
        - search_pull_requests
        - search_repositories
        - search_users
        - sub_issue_write
        - update_issue_comment
        - update_pull_request
        - update_pull_request_branch
      local_service:
        image: ghcr.io/github/github-mcp-server:v2.0.3
        container_name: acmm-github-mcp
        host_port: 8082
