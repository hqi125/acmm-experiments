services:
  github-mcp:
    image: ${ACMM_GITHUB_MCP_IMAGE}
    container_name: ${ACMM_GITHUB_MCP_CONTAINER}
    command: ["http"]
    environment:
      GITHUB_TOOLSETS: ${ACMM_GITHUB_MCP_TOOLSETS}
      GITHUB_EXCLUDE_TOOLS: ${ACMM_GITHUB_MCP_EXCLUDE_TOOLS}
    ports:
      - "${ACMM_GITHUB_MCP_HOST_PORT}:8082"
    restart: "no"
