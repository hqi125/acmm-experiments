services:
  github-mcp:
    image: ${ACMM_GITHUB_MCP_IMAGE}
    container_name: ${ACMM_GITHUB_MCP_CONTAINER}
    command: ["http"]
    environment:
      GITHUB_TOOLSETS: ${ACMM_GITHUB_MCP_TOOLSETS}
      GITHUB_EXCLUDE_TOOLS: ${ACMM_GITHUB_MCP_EXCLUDE_TOOLS}
      GITHUB_FEATURES: ""
      GITHUB_INSIDERS: "false"
      ACMM_GITHUB_MCP_GOVERNOR_ENABLED: "1"
      ACMM_GITHUB_MCP_REQUEST_INTERVAL: ${ACMM_GITHUB_MCP_REQUEST_INTERVAL}
      ACMM_GITHUB_MCP_MUTATION_INTERVAL: ${ACMM_GITHUB_MCP_MUTATION_INTERVAL}
      ACMM_GITHUB_MCP_RETRY_AFTER_GRACE: ${ACMM_GITHUB_MCP_RETRY_AFTER_GRACE}
      ACMM_GITHUB_MCP_PRIMARY_RESET_GRACE: ${ACMM_GITHUB_MCP_PRIMARY_RESET_GRACE}
      ACMM_GITHUB_MCP_SECONDARY_BACKOFF: ${ACMM_GITHUB_MCP_SECONDARY_BACKOFF}
      ACMM_GITHUB_MCP_GOVERNOR_STATE_FILE: /var/lib/acmm-github-mcp/governor.json
      ACMM_GITHUB_MCP_PPH_GATE_FILE: /var/lib/acmm-github-mcp/pph-gate.json
      ACMM_GITHUB_MCP_UNADMITTED_TOKEN: "acmm-runtime-admission-required"
    ports:
      - "${ACMM_GITHUB_MCP_HOST_PORT}:8082"
    volumes:
      - ./mcp-governor-state:/var/lib/acmm-github-mcp
    restart: "no"
