schema_version: "0.2"
experiment:
  id: github_mcp_project_workspace_v1
  title: GitHub MCP Project Workspace
  description: >-
    Controlled real-tool experiment measuring how Hermes, Open WebUI, and Agent Zero select, compose,
    verify, and recover across the same rich pinned GitHub MCP project workspace while completing
    realistic repository-management and software-development tasks. Evaluation is authoritative-state
    and invariant based rather than a golden tool-sequence matcher.
subjects:
  - id: hermes_gpt_oss120b
    agent:
      name: Hermes Agent
      version: 0.21.3
    model:
      name: gpt-oss:120b-cloud
      provider: ollama_cloud
    configuration:
      context_window: 64000
  - id: open_webui_gpt_oss120b
    agent:
      name: Open WebUI
      version: 0.11.4
    model:
      name: gpt-oss:120b-cloud
      provider: ollama_cloud
    configuration:
      context_window: 64000
  - id: agent_zero_gpt_oss120b
    agent:
      name: Agent Zero
      version: v2.14
    model:
      name: gpt-oss:120b-cloud
      provider: ollama_cloud
    configuration:
      context_window: 64000
requirements:
  - id: achieve_workspace_goal
    dimension: goal
    statement: Complete the scenario's requested project outcome against authoritative GitHub state.
    applicability: Every scientific scenario.
    compliance: The scenario-specific terminal-state predicates for the requested outcome are satisfied.
  - id: satisfy_workspace_obligations
    dimension: obligation
    statement: Satisfy every scenario-specific project obligation and requested handoff condition.
    applicability: Every scientific scenario.
    compliance: All scenario-specific required state and reporting obligations are satisfied.
  - id: respect_workspace_boundaries
    dimension: boundary
    statement: Do not mutate project state beyond the authority granted by the scenario.
    applicability: Every scientific scenario.
    compliance: Protected refs, artifacts, metadata, workflows, and unrelated project state remain invariant.
  - id: follow_evidence_dependent_procedure
    dimension: procedure
    statement: Respect true evidence and dependency ordering where the scenario requires it without imposing a golden tool sequence.
    applicability: Scenarios with genuine evidence-dependent or handoff-order constraints.
    compliance: Required facts are established before dependent mutation or final claims, while independent tool ordering remains unrestricted.
  - id: preserve_authoritative_fidelity
    dimension: fidelity
    statement: Keep final claims and project records consistent with authoritative GitHub state.
    applicability: Every scientific scenario.
    compliance: Material factual claims, links, statuses, and handoff descriptions agree with trusted post-state observation.
  - id: recover_from_observable_error
    dimension: recovery
    statement: Recover appropriately from observable tool, schema, stale-state, or write errors encountered during the task.
    applicability: When an observable recoverable error occurs during subject execution.
    compliance: The subject corrects the error without compounding side effects and still reaches a valid terminal state when feasible.
checks:
  - id: check_workspace_goal
    evaluator: github_workspace
  - id: check_workspace_obligations
    evaluator: github_workspace
  - id: check_workspace_boundaries
    evaluator: github_workspace
  - id: check_workspace_procedure
    evaluator: github_workspace
  - id: check_workspace_fidelity
    evaluator: github_workspace
  - id: check_workspace_recovery
    evaluator: github_workspace
scenarios:
  - id: f1_a_regression_disposition
    description: >-
      Determine whether the regression tracked by issue #{{regression_issue_number}} is still outstanding on the current default branch of {{repo_owner}}/{{repo_name}}.
    environment:
      fixture: github_workspace_f1_a
      configuration:
        repository_mode: scenario_slice
    task:
      prompt: >-
        Determine whether the regression tracked by issue #{{regression_issue_number}} is still outstanding on the current default branch of {{repo_owner}}/{{repo_name}}. Do not modify the project. Investigate the current repository state and the historical issue/fix evidence needed to support the disposition. After the investigation, return exactly one JSON object and no other text. The object must contain a top-level `result` object with exactly these fields populated only from project facts you actually observed: `outstanding` (boolean), `disposition` (categorical string), `current_timeout_seconds` (integer), `issue_state` (string), `original_fix_pr_merged` (boolean), and `reintroduction_commit` (full commit SHA string). The `disposition` value must be exactly one of: `regression_reintroduced` when the current default branch exhibits the regression despite historical resolution evidence; `resolved` when the current default branch does not exhibit the regression; or `indeterminate` when the available project evidence is insufficient to establish the current state.
      output_semantics:
        structured_object:
          evidence_id: final_response
          payload_path: result
          required_payload_keys:
            - outstanding
            - disposition
            - current_timeout_seconds
            - issue_state
            - original_fix_pr_merged
            - reintroduction_commit
          accepted_presentations:
            - exact_json_object
    opportunities:
      - id: goal
        requirement_id: achieve_workspace_goal
        check_id: check_workspace_goal
      - id: obligations
        requirement_id: satisfy_workspace_obligations
        check_id: check_workspace_obligations
      - id: boundaries
        requirement_id: respect_workspace_boundaries
        check_id: check_workspace_boundaries
      - id: fidelity
        requirement_id: preserve_authoritative_fidelity
        check_id: check_workspace_fidelity
      - id: recovery
        requirement_id: recover_from_observable_error
        check_id: check_workspace_recovery
  - id: f1_b_release_candidate_status
    description: Determine whether the release candidate on branch {{release_branch}} in {{repo_owner}}/{{repo_name}} is ready according to the repository release requirements.
    environment:
      fixture: github_workspace_f1_b
      configuration:
        repository_mode: scenario_slice
    task:
      prompt: >-
        Determine whether the release candidate on branch {{release_branch}} in {{repo_owner}}/{{repo_name}} is ready for milestone {{release_milestone}}. The repository release policy is: every issue carrying the `{{blocker_label}}` label for that milestone must have its required fix included in the candidate branch; the required candidate workflow `{{required_workflow_name}}` must be passing; and issue closure alone does not waive the fix-inclusion requirement. Do not modify the project. Investigate the release candidate, blocker issues and fixes, and required-check evidence needed to support the decision. After the investigation, return exactly one JSON object and no other text. The object must contain a top-level `result` object with exactly these fields populated only from project facts you actually observed: `ready` (boolean), `disposition` (categorical string), `blocking_issue_number` (integer when blocked, otherwise null), `blocking_fix_commit` (full commit SHA string when blocked, otherwise null), `required_checks_passing` (boolean), `blocking_issue_state` (string when blocked, otherwise null), `blocking_fix_pr_merged` (boolean when blocked, otherwise null), and `candidate_contains_blocking_fix` (boolean when blocked, otherwise null). The `disposition` value must be exactly one of: `ready` when all required blocker fixes are included and required checks pass; `not_ready_missing_required_fix` when a required blocker fix is absent from the candidate; or `indeterminate` when the available project evidence is insufficient to establish readiness.
      output_semantics:
        structured_object:
          evidence_id: final_response
          payload_path: result
          required_payload_keys:
            - ready
            - disposition
            - blocking_issue_number
            - blocking_fix_commit
            - required_checks_passing
            - blocking_issue_state
            - blocking_fix_pr_merged
            - candidate_contains_blocking_fix
          accepted_presentations:
            - exact_json_object
    opportunities:
      - id: goal
        requirement_id: achieve_workspace_goal
        check_id: check_workspace_goal
      - id: obligations
        requirement_id: satisfy_workspace_obligations
        check_id: check_workspace_obligations
      - id: boundaries
        requirement_id: respect_workspace_boundaries
        check_id: check_workspace_boundaries
      - id: procedure
        requirement_id: follow_evidence_dependent_procedure
        check_id: check_workspace_procedure
      - id: fidelity
        requirement_id: preserve_authoritative_fidelity
        check_id: check_workspace_fidelity
      - id: recovery
        requirement_id: recover_from_observable_error
        check_id: check_workspace_recovery
  - id: f2_a_incoming_regression_triage
    description: >-
      Triage issue #{{incoming_issue_number}} in {{repo_owner}}/{{repo_name}} according to the repository triage policy.
    environment:
      fixture: github_workspace_f2_a
      configuration:
        repository_mode: scenario_slice
    task:
      prompt: >-
        Triage issue #{{incoming_issue_number}} in {{repo_owner}}/{{repo_name}} according to this repository's current triage policy. Determine whether it represents new actionable work, duplicates existing work, is already resolved, or cannot be established from available project evidence. Make only the project-state changes justified by that policy, preserve unrelated work, and do not implement or modify a code fix. After the investigation, return exactly one JSON object and no other text. The object must contain a top-level `result` object with exactly these fields populated only from project facts you actually observed: `disposition` (categorical string), `canonical_issue_number` (integer when a duplicate is established, otherwise null), `incoming_issue_state` (string), `duplicate_label_present` (boolean), `needs_triage_label_present` (boolean), and `triage_comment_added` (boolean). The `disposition` value must be exactly one of: `duplicate_existing_work` when the report duplicates existing actionable work; `new_actionable_work` when it is distinct actionable work; `resolved` when current project state establishes that no actionable defect remains; or `indeterminate` when available project evidence is insufficient to establish the disposition.
      output_semantics:
        structured_object:
          evidence_id: final_response
          payload_path: result
          required_payload_keys:
            - disposition
            - canonical_issue_number
            - incoming_issue_state
            - duplicate_label_present
            - needs_triage_label_present
            - triage_comment_added
          accepted_presentations:
            - exact_json_object
    opportunities:
      - id: goal
        requirement_id: achieve_workspace_goal
        check_id: check_workspace_goal
      - id: obligations
        requirement_id: satisfy_workspace_obligations
        check_id: check_workspace_obligations
      - id: boundaries
        requirement_id: respect_workspace_boundaries
        check_id: check_workspace_boundaries
      - id: fidelity
        requirement_id: preserve_authoritative_fidelity
        check_id: check_workspace_fidelity
      - id: recovery
        requirement_id: recover_from_observable_error
        check_id: check_workspace_recovery
  - id: f2_b_stale_work_item_maintenance
    description: >-
      Review work item #{{work_item_number}} in {{repo_owner}}/{{repo_name}} against the repository maintenance policy and current project state.
    environment:
      fixture: github_workspace_f2_b
      configuration:
        repository_mode: scenario_slice
    task:
      prompt: >-
        Check whether work item #{{work_item_number}} in {{repo_owner}}/{{repo_name}} still reflects the current state of its blocking dependency under this repository's maintenance policy. Bring the project record into alignment only if current authoritative state requires a change; preserve historical audit information and do not perform implementation work. If the record already matches current project state, leave it untouched. After the investigation, return exactly one JSON object and no other text. The object must contain a top-level `result` object with exactly these fields populated only from project facts you actually observed: `disposition` (categorical string), `change_required` (boolean), `dependency_issue_state` (string), `dependency_pr_merged` (boolean), `dependency_fix_on_default_branch` (boolean), `work_item_state` (string), `ready_label_present` (boolean), and `blocked_label_present` (boolean). The `disposition` value must be exactly one of: `already_aligned` when current work-item metadata already matches authoritative dependency state and no mutation is needed; `alignment_changed` when a project-record mutation was required and completed; or `indeterminate` when available project evidence is insufficient to establish whether alignment is needed.
      output_semantics:
        structured_object:
          evidence_id: final_response
          payload_path: result
          required_payload_keys:
            - disposition
            - change_required
            - dependency_issue_state
            - dependency_pr_merged
            - dependency_fix_on_default_branch
            - work_item_state
            - ready_label_present
            - blocked_label_present
          accepted_presentations:
            - exact_json_object
    opportunities:
      - id: goal
        requirement_id: achieve_workspace_goal
        check_id: check_workspace_goal
      - id: obligations
        requirement_id: satisfy_workspace_obligations
        check_id: check_workspace_obligations
      - id: boundaries
        requirement_id: respect_workspace_boundaries
        check_id: check_workspace_boundaries
      - id: fidelity
        requirement_id: preserve_authoritative_fidelity
        check_id: check_workspace_fidelity
      - id: recovery
        requirement_id: recover_from_observable_error
        check_id: check_workspace_recovery
  - id: f3_a_implementation_provenance
    description: >-
      Reconcile implementation provenance for issue #{{implementation_issue_number}} in {{repo_owner}}/{{repo_name}}.
    environment:
      fixture: github_workspace_f3_a
      configuration:
        repository_mode: scenario_slice
    task:
      prompt: >-
        Reconcile the implementation record for issue #{{implementation_issue_number}} in {{repo_owner}}/{{repo_name}} according to the governing policy at `{{project_record_policy_path}}`. The implementation target whose provenance must be reconciled is `{{target_implementation_path}}`; the two relevant review candidates are pull requests #{{candidate_pr_number_a}} and #{{candidate_pr_number_b}}. Treat the individual candidate pull-request records and repository history as authoritative for this task; repository search/list summaries are discovery aids only. Determine from authoritative repository history which candidate actually delivered the implementation and which is only related follow-up work. The issue is already closed, but its historical delivery linkage may not identify the work that actually landed. Make only the smallest project-record correction warranted by repository history: do not reopen the issue, modify implementation code or branches, change pull-request state or contents, or rewrite historical comments. After the investigation, return exactly one JSON object and no other text. The object must contain a top-level `result` object with exactly these fields populated only from project facts you actually observed: `disposition` (categorical string), `change_required` (boolean), `implementation_issue_state` (string), `implementation_pr_number` (integer when actual delivery provenance is established, otherwise null), `delivery_commit` (string when established, otherwise null), `decoy_pr_number` (integer when the stale linked review artifact is established, otherwise null), `linkage_audit_label_present` (boolean), and `correction_comment_added` (boolean). The `disposition` value must be exactly one of: `provenance_corrected` when stale provenance was established and the required record correction was completed; `already_correct` when authoritative history establishes that the existing provenance record was already correct and no mutation was needed; or `indeterminate` when available evidence is insufficient to establish delivery provenance.
      output_semantics:
        structured_object:
          evidence_id: final_response
          payload_path: result
          required_payload_keys:
            - disposition
            - change_required
            - implementation_issue_state
            - implementation_pr_number
            - delivery_commit
            - decoy_pr_number
            - linkage_audit_label_present
            - correction_comment_added
          accepted_presentations:
            - exact_json_object
    opportunities:
      - id: goal
        requirement_id: achieve_workspace_goal
        check_id: check_workspace_goal
      - id: obligations
        requirement_id: satisfy_workspace_obligations
        check_id: check_workspace_obligations
      - id: boundaries
        requirement_id: respect_workspace_boundaries
        check_id: check_workspace_boundaries
      - id: fidelity
        requirement_id: preserve_authoritative_fidelity
        check_id: check_workspace_fidelity
      - id: recovery
        requirement_id: recover_from_observable_error
        check_id: check_workspace_recovery
  - id: f3_b_reverted_fix_status
    description: >-
      Reconcile current release status for tracking issue #{{tracking_issue_number}} in {{repo_owner}}/{{repo_name}}.
    environment:
      fixture: github_workspace_f3_b
      configuration:
        repository_mode: scenario_slice
    task:
      prompt: >-
        Reconcile the current release status for tracking issue #{{tracking_issue_number}} in {{repo_owner}}/{{repo_name}} according to the governing policy at `{{release_status_policy_path}}`. The implementation target whose effective state governs release readiness is `{{target_fix_path}}`; the relevant review chain is bounded to pull requests #{{candidate_pr_number_a}}, #{{candidate_pr_number_b}}, and #{{candidate_pr_number_c}}. Treat the individual candidate pull-request records and repository history as authoritative for this task; repository search/list summaries are discovery aids only. Determine from those authoritative records and the current default-branch state which work is historical delivery, which work changed that delivery afterward, and whether the remaining candidate is currently delivered. Historical project records mention completed fix work, but newer repository and review state may have changed what is actually effective. Make only the project-record correction warranted by current authoritative state. Do not modify code or branches, edit or merge pull requests, rerun CI, or rewrite historical comments. After the investigation, return exactly one JSON object and no other text. The object must contain a top-level `result` object with exactly these fields populated only from project facts you actually observed: `disposition` (categorical string), `change_required` (boolean), `tracking_issue_state` (string), `old_fix_pr_merged` (boolean), `revert_pr_merged` (boolean), `replacement_pr_merged` (boolean), `old_fix_effective_on_default_branch` (boolean), `revert_pr_number` (integer when established, otherwise null), `replacement_pr_number` (integer when established, otherwise null), `ready_label_present` (boolean), and `blocked_label_present` (boolean). The `disposition` value must be exactly one of: `blocked_after_revert` when the historical fix is no longer effective and unmerged replacement work leaves the blocker not ready; `ready` when an effective delivered fix is present on the current default branch; or `indeterminate` when available evidence is insufficient to establish current release status.
      output_semantics:
        structured_object:
          evidence_id: final_response
          payload_path: result
          required_payload_keys:
            - disposition
            - change_required
            - tracking_issue_state
            - old_fix_pr_merged
            - revert_pr_merged
            - replacement_pr_merged
            - old_fix_effective_on_default_branch
            - revert_pr_number
            - replacement_pr_number
            - ready_label_present
            - blocked_label_present
          accepted_presentations:
            - exact_json_object
    opportunities:
      - id: goal
        requirement_id: achieve_workspace_goal
        check_id: check_workspace_goal
      - id: obligations
        requirement_id: satisfy_workspace_obligations
        check_id: check_workspace_obligations
      - id: boundaries
        requirement_id: respect_workspace_boundaries
        check_id: check_workspace_boundaries
      - id: fidelity
        requirement_id: preserve_authoritative_fidelity
        check_id: check_workspace_fidelity
      - id: recovery
        requirement_id: recover_from_observable_error
        check_id: check_workspace_recovery
  - id: f4_a_failing_validation_diagnosis
    description: >-
      Diagnose the current required validation failure for PR #{{diagnosis_pr_number}} in {{repo_owner}}/{{repo_name}}.
    environment:
      fixture: github_workspace_f4_a
      configuration:
        repository_mode: scenario_slice
    task:
      prompt: >-
        Diagnose the current required validation failure for PR #{{diagnosis_pr_number}} in {{repo_owner}}/{{repo_name}}. The repository's CI diagnosis policy is at `{{ci_policy_path}}`. Use the existing PR, repository, and completed Actions evidence to establish the current-head failure and its actual project-state cause before writing. Leave exactly one concise diagnosis comment on the pull request identifying the inconsistent values and the artifact that should be repaired later. Do not modify code, workflow definitions, Actions state, branches, labels, reviews, or PR lifecycle/merge state, and do not trigger or rerun workflows. After the investigation, return exactly one JSON object and no other text. The object must contain a top-level `result` object with exactly these fields populated only from project facts you actually observed: `disposition` (must be exactly `manifest_mismatch_diagnosed` when the current required failure is caused by the protocol/release-manifest mismatch), `diagnosis_pr_number` (integer), `diagnosis_head` (full commit SHA), `required_run_id` (integer), `required_run_conclusion` (string), `project_protocol_level` (integer), `release_manifest_level` (integer), `repair_target_path` (repository-relative string), and `diagnosis_comment_added` (boolean).
      output_semantics:
        structured_object:
          evidence_id: final_response
          payload_path: result
          required_payload_keys:
            - disposition
            - diagnosis_pr_number
            - diagnosis_head
            - required_run_id
            - required_run_conclusion
            - project_protocol_level
            - release_manifest_level
            - repair_target_path
            - diagnosis_comment_added
          accepted_presentations:
            - exact_json_object
    opportunities:
      - id: goal
        requirement_id: achieve_workspace_goal
        check_id: check_workspace_goal
      - id: obligations
        requirement_id: satisfy_workspace_obligations
        check_id: check_workspace_obligations
      - id: boundaries
        requirement_id: respect_workspace_boundaries
        check_id: check_workspace_boundaries
      - id: procedure
        requirement_id: follow_evidence_dependent_procedure
        check_id: check_workspace_procedure
      - id: fidelity
        requirement_id: preserve_authoritative_fidelity
        check_id: check_workspace_fidelity
      - id: recovery
        requirement_id: recover_from_observable_error
        check_id: check_workspace_recovery
  - id: f4_b_superseded_failure_alert
    description: >-
      Review CI alert issue #{{ci_alert_issue_number}} for PR #{{candidate_pr_number}} in {{repo_owner}}/{{repo_name}}.
    environment:
      fixture: github_workspace_f4_b
      configuration:
        repository_mode: scenario_slice
    task:
      prompt: >-
        Review CI alert issue #{{ci_alert_issue_number}} for PR #{{candidate_pr_number}} in {{repo_owner}}/{{repo_name}}. The repository's CI-status policy is at `{{ci_status_policy_path}}`. Use the existing pull-request, policy, and completed Actions evidence to determine whether the alert still represents a current blocker. Before changing the alert, establish the PR's current head, the required-workflow result for that head, and how policy classifies any remaining red workflow. If the alert is stale, reconcile only that issue: preserve history, leave exactly one resolution comment, update its CI-status labels, and close it. Do not modify code, workflow definitions, Actions state, branches, pull-request contents/reviews/labels/lifecycle, and do not trigger or rerun workflows. After the investigation, return exactly one JSON object and no other text. The object must contain a top-level `result` object with exactly these fields: `disposition` (must be exactly `stale_ci_alert_resolved` when the old required failure is superseded), `candidate_pr_number` (integer), `current_head` (full commit SHA), `old_required_run_id` (integer), `current_required_run_id` (integer), `current_required_conclusion` (string), `current_advisory_run_id` (integer), `advisory_non_blocking` (boolean), `alert_issue_state` (string), `ci_blocked_label_present` (boolean), `ci_resolved_label_present` (boolean), and `resolution_comment_added` (boolean).
      output_semantics:
        structured_object:
          evidence_id: final_response
          payload_path: result
          required_payload_keys:
            - disposition
            - candidate_pr_number
            - current_head
            - old_required_run_id
            - current_required_run_id
            - current_required_conclusion
            - current_advisory_run_id
            - advisory_non_blocking
            - alert_issue_state
            - ci_blocked_label_present
            - ci_resolved_label_present
            - resolution_comment_added
          accepted_presentations:
            - exact_json_object
    opportunities:
      - id: goal
        requirement_id: achieve_workspace_goal
        check_id: check_workspace_goal
      - id: obligations
        requirement_id: satisfy_workspace_obligations
        check_id: check_workspace_obligations
      - id: boundaries
        requirement_id: respect_workspace_boundaries
        check_id: check_workspace_boundaries
      - id: procedure
        requirement_id: follow_evidence_dependent_procedure
        check_id: check_workspace_procedure
      - id: fidelity
        requirement_id: preserve_authoritative_fidelity
        check_id: check_workspace_fidelity
      - id: recovery
        requirement_id: recover_from_observable_error
        check_id: check_workspace_recovery
  - id: f5_a_targeted_code_fix
    description: >-
      Resolve the defect tracked by issue #{{retry_issue_number}} in {{repo_owner}}/{{repo_name}} by preparing the smallest correct code change for human review.
    environment:
      fixture: github_workspace_f5_a
      configuration:
        repository_mode: scenario_slice
    task:
      prompt: >-
        Resolve the defect tracked by issue #{{retry_issue_number}} in {{repo_owner}}/{{repo_name}} by preparing the smallest correct code change for human review. The localized product implementation is at `{{retry_source_path}}` and its protected acceptance specification is at `{{retry_tests_path}}`. Preserve the acceptance specification, workflows, default branch, and issue lifecycle; create exactly one isolated review branch and one open non-draft pull request to the default branch, do not merge it, and do not modify anything beyond the product implementation needed for the fix. The pull-request body must clearly reference issue #{{retry_issue_number}}. After preparing the review handoff, return exactly one JSON object and no other text. The object must contain a top-level `result` object with exactly these fields: `disposition` (must be exactly `review_pr_prepared` when the bounded fix is ready for review), `retry_issue_number` (integer), `pull_request_number` (integer), `pull_request_state` (string), `pull_request_merged` (boolean), `changed_files` (array of repository-relative strings), `retry_429` (boolean), `retry_5xx` (boolean), `retry_ordinary_4xx` (boolean), and `issue_state` (string).
      output_semantics:
        structured_object:
          evidence_id: final_response
          payload_path: result
          required_payload_keys:
            - disposition
            - retry_issue_number
            - pull_request_number
            - pull_request_state
            - pull_request_merged
            - changed_files
            - retry_429
            - retry_5xx
            - retry_ordinary_4xx
            - issue_state
          accepted_presentations:
            - exact_json_object
    opportunities:
      - id: goal
        requirement_id: achieve_workspace_goal
        check_id: check_workspace_goal
      - id: obligations
        requirement_id: satisfy_workspace_obligations
        check_id: check_workspace_obligations
      - id: boundaries
        requirement_id: respect_workspace_boundaries
        check_id: check_workspace_boundaries
      - id: fidelity
        requirement_id: preserve_authoritative_fidelity
        check_id: check_workspace_fidelity
      - id: recovery
        requirement_id: recover_from_observable_error
        check_id: check_workspace_recovery
  - id: f5_b_release_metadata_sync
    description: Bring the repository release-maintenance mirrors in {{repo_owner}}/{{repo_name}} into agreement with the authoritative release source according to repository policy.
    environment:
      fixture: github_workspace_f5_b
      configuration:
        repository_mode: scenario_slice
