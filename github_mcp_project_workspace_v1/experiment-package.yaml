schema_version: "0.4"
experiment_id: github_mcp_project_workspace_v1
contract: experiment.yaml

campaign:
  materialization:
    group_by:
      - scenario_id

runtime:
  api_version: "0.1"
  root: runtime
  entrypoint: build_runtime

secrets:
  - id: controller_access_token
    required: true
  - id: github_app_private_key
    required: true

integrations:
  - id: github_mcp
    api_version: "0.2"
    root: integration/github_mcp
    entrypoint: build_integration
    preset: local_pinned
    configuration:
      endpoint: http://host.docker.internal:8083
      github_api_base: https://api.github.com
      server_id: github
      toolsets:
        - repos
        - issues
        - pull_requests
        - users
        - actions
        - git
        - labels
      excluded_tools:
        - actions_run_trigger
        - create_repository
        - delete_repository
        - fork_repository
        - get_team_members
        - get_teams
        - list_issue_fields
        - list_issue_types
        - ui_get
      expected_tools:
        - actions_get
        - actions_list
        - add_comment_to_pending_review
        - add_issue_comment
        - add_reply_to_pull_request_comment
        - create_branch
        - create_or_update_file
        - create_pull_request
        - delete_file
        - get_commit
        - get_file_contents
        - get_job_logs
        - get_label
        - get_latest_release
        - get_release_by_tag
        - get_repository_tree
        - get_tag
        - issue_read
        - issue_write
        - label_write
        - list_branches
        - list_commits
        - list_issues
        - list_label
        - list_pull_requests
        - list_releases
        - list_repository_collaborators
        - list_tags
        - merge_pull_request
        - pull_request_read
        - pull_request_review_write
        - push_files
        - search_code
        - search_commits
        - search_issues
        - search_pull_requests
        - search_repositories
        - search_users
        - sub_issue_write
        - update_issue_comment
        - update_pull_request
        - update_pull_request_branch
      expected_catalog_sha256: 0b6d56cef0521915db11229a7d6a3e180bdfded83a5956d81347b5e11a547e33
      local_service:
        image: acmm/github-mcp-server:v2.1.0-acmm-governed-v1
        container_name: acmm-github-mcp-exp2
        host_port: 8083
        source_repository: https://github.com/hqi125/acmm-github-mcp-server.git
        source_commit: "41ea87f6670a7a7cc08640f1b2d65495cfa1a5c8"
        upstream_version: v2.1.0
        upstream_commit: 4bcdcdf8d7beee98c9448e73e257308280924cc4
        governor_version: v1
        request_interval: 500ms
        mutation_interval: 2s
        retry_after_grace: 3s
        primary_reset_grace: 3s
        secondary_backoff: 60s,120s,240s,480s,960s
